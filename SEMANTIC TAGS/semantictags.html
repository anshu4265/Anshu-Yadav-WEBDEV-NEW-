<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!-- i. `<header>` — Top / Introduction

Defines the **header** of a page or a section. Usually contains a heading, logo, or intro text. -->


<!-- 🖥️ Output: A large heading "My Website" followed by the line "Welcome to my awesome website!" -->

<header>
    <h1>
        MY WEBSITE
    </h1>
    <P>
        Welcome to my awesome website!
    </P>
</header>
<footer>
    <p>&copy; 2024 My Website. All rights reserved.</p>
    <p>Contact: contact@example.com</p>
</footer>
<nav>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/Contact">Contact</a></li>
    </ul>
</nav>
</body>
</html>
