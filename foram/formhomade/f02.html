<!-- Radio Buttons
The <input type="radio"> defines a radio button.

Radio buttons let a user select ONE of a limited 
number of choices. -->





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>RADIA BUTTOMS</h1>
    <p>CHOSE YOUR FAVORATE DISH</p>
    <form>
        <input type="radio" id="CHOLLA" name="fav_dish" value="CHOLLA">
        <label for="CHOLLA">CHOLLA</label><br>
        <input type="radio" id="BHATURA" name="fav-dish" value="BHATURA">
        <label for="BHATURA">BHATURA</label>
    </form>
    
</body>
</html>
