<!-- Checkboxes
The <input type="checkbox"> defines a checkbox.

Checkboxes let a user select ZERO or MORE options of a limited number of choices. -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <input type="checkbox" id="dish 1" name="cholla" value="garam cholla">
        <label for="dish 1"> i have a garam cholla </label><br>
        <input type="checkbox" id="dish 2" name="cholla" value="plane cholla">
        <label for="dish 2"> i have a plane cholla </label><br>
    </form>
    
</body>
</html>
